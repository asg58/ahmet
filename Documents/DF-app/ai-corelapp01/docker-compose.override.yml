# Docker Compose Override Configuration
# Development-specific overrides for docker-compose.yml

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Add logging driver to existing services
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:4000/api
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: '0.5'

  server:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./server:/app/server
      - ./src:/app/src
      - ./logs:/app/logs
      - ./data:/app/data
      - /app/node_modules
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - CHROMA_API_IMPL=rest
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_HTTP_PORT=8000
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - BLENDER_BRIDGE_ENDPOINT=http://blender-bridge:4201
      - BLENDER_BRIDGE_WS_ENDPOINT=ws://blender-bridge:4203
      - CORELDRAW_BRIDGE_ENDPOINT=http://coreldraw-bridge:3001
      - LOG_LEVEL=debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: '1.0'
    depends_on:
      - chromadb
      - ollama
      - blender-bridge
      - coreldraw-bridge

  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    volumes:
      - ./data/chromadb:/chroma/chroma
    ports:
      - "8001:8000"
    environment:
      - ALLOW_RESET=true
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: '0.5'

  # Monitoring stack
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: '0.3'

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: '0.3'

  loki:
    image: grafana/loki:latest
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki_data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512MB
          cpus: '0.3'

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - ./logs:/var/log/app
      - /var/log:/var/log
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256MB
          cpus: '0.2'

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128MB
          cpus: '0.1'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    privileged: true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256MB
          cpus: '0.3'

  blender-bridge:
    image: blender4-bridge:fixed
    volumes:
      - ./integrations/blender/logs:/app/logs
      - ./integrations/blender/data:/app/data
    environment:
      - MOCK_BLENDER=false
      - BLENDER_PATH=/opt/blender/blender
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4201/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1GB
          cpus: '0.5'

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=1h
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 12GB
          cpus: '4.0'

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local 