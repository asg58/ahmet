version: '3.8'

services:
  # Frontend (React app)
  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - app-network

  # API Gateway & WebSocket Server
  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    ports:
      - "4000:4000"  # REST API
      - "4001:4001"  # WebSocket
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - ollama
      - chromadb
    environment:
      - NODE_ENV=development
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    networks:
      - app-network

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ChromaDB Vector Database
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  chromadb_data:
    driver: local 