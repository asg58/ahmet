version: '3.8'

services:
  coreldraw-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coreldraw_bridge
    ports:
      - "3001:3001"  # REST API
      - "3002:3002"  # WebSocket
    environment:
      - PORT=3001
      - WEBSOCKET_PORT=3002
      - HOST=0.0.0.0
      - CORELDRAW_PATH=C:\\Program Files\\Corel\\CorelDRAW Graphics Suite 2021\\Programs\\CorelDRW.exe
      - MOCK_CORELDRAW=true
      - LOG_LEVEL=info
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - type: bind
        source: /c/Program Files/Corel/CorelDRAW Graphics Suite 2021
        target: /c/Program Files/Corel/CorelDRAW Graphics Suite 2021
        read_only: true
    restart: unless-stopped 